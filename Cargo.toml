[package]
name = "appimage-hub"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
description = "Desktop GUI to download, manage, update, and launch AppImages"
repository = "https://github.com/MichaelX17/AppImage-Hub"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["appimage", "linux", "gui", "package-manager"]
categories = ["gui", "utility"]

[dependencies]
# GUI
eframe = "0.31"
egui = "0.31"
# `file` is required for the `file://` icon URIs used by the app cards;
# `image`/`svg` cover PNG and SVG icons.
egui_extras = { version = "0.31", features = ["file", "image", "svg"] }

# Async runtime & HTTP
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "time", "macros", "net", "io-util"] }
reqwest = { version = "0.12", features = ["stream"] }
octocrab = "0.43"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# XDG integration
dirs = "5"

# File picker (native KDE integration)
rfd = "0.15"

# Errors & crypto
anyhow = "1"
ring = "0.17"
thiserror = "2"

# Secret storage (GitHub token)
argon2 = "0.6"            # Argon2id KDF for the encrypted-file fallback
keyring = "4.2"           # OS keyring (Secret Service on Linux)
zeroize = "1"             # wipe plaintext token buffers after use

# Misc
uuid = { version = "1", features = ["v4"] }
libc = "0.2"              # O_NOFOLLOW for download temp files

[profile.dev]
debug = 1        # line tables only (smaller/faster than full 2)
incremental = true

[profile.dev.package."*"]
debug = 0        # no debug info for dependencies

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
